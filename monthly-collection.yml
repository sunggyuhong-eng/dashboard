name: Monthly Collection

on:
  schedule:
    # GitHub cron is UTC: 00:00 UTC = 09:00 Asia/Seoul
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Replace this month snapshot if it already exists'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      ROBOTS_UNAVAILABLE_ALLOWED_HOSTS: www.gamejob.co.kr
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and compare monthly data
        run: python scripts/run_pipeline.py --mode monthly --skip-report ${{ inputs.force && '--force' || '' }}
      - name: Run Python tests
        run: python -m pytest -q
      - name: Commit data and reports
        run: |
          if [ -z "$(git status --porcelain -- data reports logs)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports logs
          git commit -m "data: update monthly hiring report"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
