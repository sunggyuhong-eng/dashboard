name: Sync Gamejob applicant analytics

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamejob-applicant-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-gamejob.txt
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Collect Gamejob applicant analytics
        env:
          GAMEJOB_ID: ${{ secrets.GAMEJOB_ID }}
          GAMEJOB_PASSWORD: ${{ secrets.GAMEJOB_PASSWORD }}
        run: python scripts/sync_gamejob_applicants.py
      - name: Save aggregate history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/gamejob-applicants.json
          if git diff --cached --quiet; then
            echo "No applicant analytics changes"
          else
            git commit -m "data: update Gamejob applicant analytics"
            git push
          fi
