name: Manual Collection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily saves today only; monthly also creates comparison data'
        required: true
        type: choice
        options: [daily, monthly]
        default: daily
      force:
        description: 'Replace an existing snapshot'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      ROBOTS_UNAVAILABLE_ALLOWED_HOSTS: www.gamejob.co.kr
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_pipeline.py --mode "${{ inputs.mode }}" --skip-report ${{ inputs.force && '--force' || '' }}
      - run: python -m pytest -q
      - name: Commit results
        run: |
          if [ -z "$(git status --porcelain -- data reports logs)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports logs
          git commit -m "data: manual collection (${{ inputs.mode }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
